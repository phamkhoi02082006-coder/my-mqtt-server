<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Giám Sát Nhịp Tim & SpO2</title>
    <!-- Thư viện MQTT và Chart.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f6f9; padding: 20px; }
        .card-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 200px; }
        .value { font-size: 2.5em; font-weight: bold; color: #007bff; }
        .chart-box { background: white; padding: 20px; border-radius: 10px; width: 80%; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 12px 24px; font-size: 1em; margin-top: 15px; cursor: pointer; border-radius: 5px; border: none; background: #28a745; color: white; font-weight: bold; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <h2>HỆ THỐNG GIÁM SÁT NHỊP TIM & SpO2 (ESP32 + MAX30100)</h2>

    <div class="card-container">
        <div class="card">
            <h3>Nhịp Tim (BPM)</h3>
            <div id="bpm" class="value">--</div>
        </div>
        <div class="card">
            <h3>Nồng Độ Oxy (SpO2)</h3>
            <div id="spo2" class="value" style="color: #28a745;">-- %</div>
        </div>
    </div>

    <div class="chart-box">
        <canvas id="heartRateChart"></canvas>
    </div>

    <br>
    <button onclick="toggleAlarm()">Bật/Tắt Còi Báo Động ESP32</button>

    <script>
        let alarmState = false;

        // Cấu hình Biểu đồ Chart.js
        const ctx = document.getElementById('heartRateChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Nhịp tim (BPM)',
                    borderColor: 'rgb(255, 99, 132)',
                    data: [],
                    fill: false,
                    tension: 0.2
                }]
            },
            options: { responsive: true, scales: { x: { display: true }, y: { min: 40, max: 180 } } }
        });

        // Kết nối thẳng tới Broker HiveMQ qua WebSocket
        const client = mqtt.connect('wss://broker.hivemq.com:8000/mqtt');

        const topicData = 'sgu/patient/max30100/data';
        const topicControl = 'sgu/patient/max30100/control';

        client.on('connect', () => {
            console.log('✅ Đã kết nối MQTT Broker!');
            client.subscribe(topicData);
        });

        client.on('message', (topic, message) => {
            if (topic === topicData) {
                try {
                    const data = JSON.parse(message.toString());
                    
                    if (data.bpm !== undefined) document.getElementById('bpm').innerText = data.bpm;
                    if (data.spo2 !== undefined) document.getElementById('spo2').innerText = data.spo2 + ' %';

                    const now = new Date().toLocaleTimeString();
                    chart.data.labels.push(now);
                    chart.data.datasets[0].data.push(data.bpm);

                    if (chart.data.labels.length > 15) {
                        chart.data.labels.shift();
                        chart.data.datasets[0].data.shift();
                    }
                    chart.update();
                } catch (e) {
                    console.error('Lỗi nhận dữ liệu:', e);
                }
            }
        });

        function toggleAlarm() {
            alarmState = !alarmState;
            const payload = JSON.stringify({ alarm: alarmState });
            client.publish(topicControl, payload);
            alert('Đã gửi lệnh báo động: ' + (alarmState ? 'BẬT' : 'TẮT'));
        }
    </script>
</body>
</html>
